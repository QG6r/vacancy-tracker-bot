plugins {
    id 'java'
    id 'jacoco'
}

group = 'ru.skillbox'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.telegram:telegrambots-longpolling:8.0.0'
    implementation 'org.telegram:telegrambots-client:8.0.0'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'ch.qos.logback:logback-classic:1.5.12'

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

    // Тесты
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

def coverageExclusions = [
        'ru/skillbox/vacancybot/model/**',
        'ru/skillbox/vacancybot/service/client/dto/**',
        'ru/skillbox/vacancybot/Application*'
]

// Отчёт о покрытии: build/reports/jacoco/test/html/index.html
jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExclusions)
        }))
    }
}

// Проверка порога покрытия: ./gradlew jacocoTestCoverageVerification
jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExclusions)
        }))
    }
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'ru.skillbox.vacancybot.Application'
    }
}

configurations {
    mockitoAgent
}
dependencies {
    mockitoAgent('org.mockito:mockito-core:5.14.2') { transitive = false }
}
tasks.named('test') {
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}
